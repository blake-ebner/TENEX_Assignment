services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: loganalyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # backend/.env is the single source of truth for secrets, so there is one
    # file to edit and it is the same one the app reads outside Docker.
    # (ANTHROPIC_API_KEY, SECRET_KEY, and the optional ANTHROPIC_WORKSPACE_ID.)
    env_file:
      - ./backend/.env
    environment:
      # Set here rather than in .env because "db" is the compose service name
      # and only resolves inside this network.
      DATABASE_URL: postgresql://postgres:secret@db:5432/loganalyzer
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./sample_logs:/app/sample_logs

volumes:
  postgres_data: